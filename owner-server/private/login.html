<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormatFlow · כניסת בעלים</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.7 system-ui;background:radial-gradient(ellipse at 70% 0%,#55316b55,transparent 60%),#101116;color:#f4eeff;padding:24px}main{width:min(440px,100%);padding:38px;border:1px solid #393442;border-radius:29px;background:#1c1b25;box-shadow:0 30px 100px #0003}.logo{display:grid;place-items:center;width:53px;height:53px;border-radius:18px;background:linear-gradient(135deg,#af93ff,#e6a2d4);color:#20192c;font-size:34px;margin-bottom:28px}small{color:#c9b1ff}h1{font-size:30px;line-height:1.3;margin:10px 0 16px}p{color:#ada5bd;font-size:14px;margin-bottom:28px}button{width:100%;border-radius:15px;padding:14px 18px;font:650 15px system-ui;cursor:pointer;border:1px solid #494052;background:#272330;color:#f1ebff;margin:6px 0}button.primary{background:linear-gradient(110deg,#b59aff,#e5a3d4);color:#241a2c;border-color:transparent}button:disabled{opacity:.45;cursor:wait}button:focus-visible{outline:3px solid #d4bfff;outline-offset:4px}.note{font-size:12px;margin:23px 0 0;color:#a49bad}#message{font-size:13px;color:#ffb7c4;min-height:23px;margin-top:15px}
</style></head><body><main><div class="logo" aria-hidden="true">⇄</div><small>FORMATFLOW · OWNER ACCESS</small><h1>הניהול שלך.<br>בכניסה אחת.</h1><p>היכנס לחשבון שלך כדי לנהל תמונות, קישורים ופרסומות. הגישה נשמרת בדפדפן עד 30 יום, או עד להתנתקות.</p><button class="primary" data-provider="github">כניסה עם GitHub</button><button id="google" data-provider="google" hidden>כניסה עם Google</button><div id="message" role="status" aria-live="polite"></div><p class="note">רק חשבון הבעלים המוגדר מורשה להיכנס. אין צורך להדביק טוקן במסך הניהול.</p></main>
<script>
const googleEnabled='GOOGLE_ENABLED'==='true';document.getElementById('google').hidden=!googleEnabled;
if(new URL(location.href).searchParams.has('error'))document.getElementById('message').textContent='הכניסה לא אושרה. נסה שוב עם חשבון הבעלים המוגדר.';
document.querySelectorAll('[data-provider]').forEach(button=>button.addEventListener('click',async()=>{
 document.querySelectorAll('button').forEach(b=>b.disabled=true);
 try{const response=await fetch('/auth/csrf',{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw Error();const {csrfToken}=await response.json();if(!csrfToken)throw Error();
 const form=document.createElement('form');form.method='POST';form.action='/auth/signin/'+button.dataset.provider;
 for(const [name,value] of Object.entries({csrfToken,callbackUrl:'/'})){const field=document.createElement('input');field.type='hidden';field.name=name;field.value=value;form.append(field);}document.body.append(form);form.submit();
 }catch{document.getElementById('message').textContent='החיבור לא הושלם. בדוק את הרשת ונסה שוב.';document.querySelectorAll('button').forEach(b=>b.disabled=false);}
}));
</script></body></html>
