name: Build and release FormatFlow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FormatFlowNative/**'
      - 'build-assets.py'
      - '.github/workflows/release.yml'
permissions:
  contents: write
concurrency:
  group: formatflow-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select the next release version
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'FormatFlow-release' }
          $file = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/yosef-chadad/formatflow-control/contents/feed.json?ref=main'
          $feed = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($file.content)) | ConvertFrom-Json
          $path = 'FormatFlowNative/FormatFlow.csproj'
          $projectText = Get-Content -Raw $path
          [xml]$project = $projectText
          $declared = [string]$project.Project.PropertyGroup.Version
          $current = [string]$feed.latest.version
          if ($declared -notmatch '^\d+\.\d+\.\d+$' -or $current -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected three-part release versions' }
          $next = [version]$declared
          $published = [version]$current
          if ($next -le $published) { $next = [version]::new($published.Major, $published.Minor, $published.Build + 1) }
          $replacement = '<Version>' + $next.ToString() + '</Version>'
          $updated = ([regex]::new('<Version>\d+\.\d+\.\d+</Version>')).Replace($projectText, $replacement, 1)
          if ($updated -notlike "*$replacement*") { throw 'Unable to set release version' }
          Set-Content -Path $path -Value $updated -Encoding utf8 -NoNewline
          Write-Output "Building release $next"
      - name: Restore embedded resources
        run: python build-assets.py
      - name: Build Windows executable
        run: dotnet build FormatFlowNative/FormatFlow.csproj -c Release --verbosity minimal
      - name: Validate Windows UI construction
        shell: pwsh
        run: powershell.exe -NoProfile -STA -File FormatFlowNative/Tools/SmokeUi.ps1 -Exe FormatFlowNative/bin/Release/net48/FormatFlow.exe
      - name: Verify file version
        shell: pwsh
        run: |
          [xml]$project = Get-Content FormatFlowNative/FormatFlow.csproj
          $declared = [version]$project.Project.PropertyGroup.Version
          $expected = [version]::new($declared.Major, $declared.Minor, [Math]::Max(0, $declared.Build), [Math]::Max(0, $declared.Revision))
          $actual = (Get-Item FormatFlowNative/bin/Release/net48/FormatFlow.exe).VersionInfo.FileVersion
          if ([version]$actual -ne [version]$expected) { throw 'File version mismatch' }
      - name: Publish verified release and automatic update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python FormatFlowNative/Tools/publish-release.py
